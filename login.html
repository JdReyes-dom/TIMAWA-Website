<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIMAWA - Sign In</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            padding: 20px;
        }

        .container {
            max-width: 420px;
            width: 100%;
            background: #F8F9FD;
            background: linear-gradient(0deg, rgb(255, 255, 255) 0%, rgb(244, 247, 251) 100%);
            border-radius: 40px;
            padding: 40px 40px;
            border: 5px solid rgb(255, 255, 255);
            box-shadow: rgba(133, 189, 215, 0.8784313725) 0px 30px 30px -20px;
        }

        .heading {
            text-align: center;
            font-weight: 900;
            font-size: 36px;
            color: rgb(16, 137, 211);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .sub-heading {
            text-align: center;
            font-size: 14px;
            color: rgb(100, 100, 100);
            margin-bottom: 25px;
        }

        .form {
            margin-top: 10px;
        }

        .form .input {
            width: 100%;
            background: white;
            border: none;
            padding: 15px 20px;
            border-radius: 20px;
            margin-top: 15px;
            box-shadow: #cff0ff 0px 10px 10px -5px;
            border-inline: 2px solid transparent;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .form .input::placeholder {
            color: rgb(170, 170, 170);
        }

        .form .input:focus {
            outline: none;
            border-inline: 2px solid #12B1D1;
            box-shadow: #cff0ff 0px 10px 15px -8px;
        }

        .form .forgot-password {
            display: block;
            margin-top: 10px;
            margin-left: 10px;
        }

        .form .forgot-password a {
            font-size: 12px;
            color: #0099ff;
            text-decoration: none;
            cursor: pointer;
        }

        .form .forgot-password a:hover {
            text-decoration: underline;
        }

        .form .login-button {
            display: block;
            width: 100%;
            font-weight: bold;
            background: linear-gradient(45deg, rgb(16, 137, 211) 0%, rgb(18, 177, 209) 100%);
            color: white;
            padding-block: 15px;
            margin: 20px auto 10px;
            border-radius: 20px;
            box-shadow: rgba(133, 189, 215, 0.8784313725) 0px 20px 10px -15px;
            border: none;
            transition: all 0.2s ease-in-out;
            font-size: 16px;
            cursor: pointer;
        }

        .form .login-button:hover {
            transform: scale(1.02);
            box-shadow: rgba(133, 189, 215, 0.8784313725) 0px 23px 10px -20px;
        }

        .form .login-button:active {
            transform: scale(0.97);
        }

        .form .login-button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 13px;
            margin-top: 15px;
            text-align: center;
            border: 1px solid #fecaca;
            display: none;
        }

        .success-message {
            background: #dcfce7;
            color: #16a34a;
            padding: 12px 16px;
            border-radius: 15px;
            font-size: 13px;
            margin-top: 15px;
            text-align: center;
            border: 1px solid #bbf7d0;
            display: none;
        }

        .social-account-container {
            margin-top: 25px;
        }

        .social-account-container .title {
            display: block;
            text-align: center;
            font-size: 11px;
            color: rgb(170, 170, 170);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .social-account-container .social-accounts {
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .social-account-container .social-accounts .social-button {
            background: linear-gradient(45deg, rgb(0, 0, 0) 0%, rgb(112, 112, 112) 100%);
            border: 5px solid white;
            padding: 5px;
            border-radius: 50%;
            width: 44px;
            aspect-ratio: 1;
            display: grid;
            place-content: center;
            box-shadow: rgba(133, 189, 215, 0.8784313725) 0px 12px 10px -8px;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            border: none;
        }

        .social-account-container .social-accounts .social-button .svg {
            fill: white;
            margin: auto;
            width: 20px;
            height: 20px;
        }

        .social-account-container .social-accounts .social-button:hover {
            transform: scale(1.1);
        }

        .agreement {
            display: block;
            text-align: center;
            margin-top: 15px;
        }

        .agreement a {
            text-decoration: none;
            color: #0099ff;
            font-size: 10px;
        }

        .signup-link {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #666;
        }

        .signup-link a {
            color: rgb(16, 137, 211);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 35px;
            border-radius: 30px;
            max-width: 400px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: rgba(133, 189, 215, 0.5) 0px 30px 40px -20px;
        }

        .modal-content h2 {
            text-align: center;
            color: rgb(16, 137, 211);
            margin-bottom: 20px;
            font-size: 24px;
        }

        .modal-content .input {
            width: 100%;
            background: #f8faff;
            border: 2px solid #e0e7ff;
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 12px;
            font-size: 14px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        .modal-content .input:focus {
            outline: none;
            border-color: rgb(16, 137, 211);
            box-shadow: 0 0 0 3px rgba(16, 137, 211, 0.1);
        }

        .modal-content .login-button {
            display: block;
            width: 100%;
            font-weight: bold;
            background: linear-gradient(45deg, rgb(16, 137, 211) 0%, rgb(18, 177, 209) 100%);
            color: white;
            padding: 15px;
            border-radius: 15px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .modal-content .login-button:hover {
            transform: scale(1.02);
        }

        .modal-content .cancel-btn {
            display: block;
            width: 100%;
            margin-top: 10px;
            padding: 12px;
            border: none;
            background: #f3f4f6;
            border-radius: 15px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .modal-content .cancel-btn:hover {
            background: #e5e7eb;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
            
            .heading {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="heading">🇹🇮🇲🇦🇼🇦</div>
        <div class="sub-heading">✨ Sign in to access the hub ✨</div>
        
        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>
        
        <form id="loginForm" class="form">
            <input required class="input" type="email" id="email" placeholder="E-mail" />
            <input required class="input" type="password" id="password" placeholder="Password" />
            <span class="forgot-password"><a onclick="resetPassword()">Forgot Password?</a></span>
            <button type="submit" class="login-button" id="loginBtn">Sign In</button>
        </form>
        
        <div class="social-account-container">
            <span class="title">Or Sign in with</span>
            <div class="social-accounts">
                <button class="social-button google" onclick="signInWithGoogle()" style="background: #4285f4;">
                    <svg class="svg" xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 488 512">
                        <path d="M488 261.8C488 403.3 391.1 504 248 504 110.8 504 0 393.2 0 256S110.8 8 248 8c66.8 0 123 24.5 166.3 64.9l-67.5 64.9C258.5 52.6 94.3 116.6 94.3 256c0 86.5 69.1 156.6 153.7 156.6 98.2 0 135-70.4 140.8-106.9H248v-85.3h236.1c2.3 12.7 3.9 24.9 3.9 41.4z"></path>
                    </svg>
                </button>
                <button class="social-button" onclick="signInWithGithub()" style="background: #24292e;">
                    <svg class="svg" xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 496 512">
                        <path d="M165.9 397.4c0 2-2.3 3.6-5.2 3.6-3.3.3-5.6-1.3-5.6-3.6 0-2 2.3-3.6 5.2-3.6 3-.3 5.6 1.3 5.6 3.6zm-31.1-4.5c-.7 2 1.3 4.3 4.3 4.9 2.6 1 5.6 0 6.2-2s-1.3-4.3-4.3-5.2c-2.6-.7-5.5.3-6.2 2.3zm44.2-1.7c-2.9.7-4.9 2.6-4.6 4.9.3 2 2.9 3.3 5.9 2.6 2.9-.7 4.9-2.6 4.6-4.6-.3-1.9-3-3.2-5.9-2.9zM244.8 8C106.1 8 0 113.3 0 252c0 110.9 69.8 205.8 169.5 239.2 12.8 2.3 17.3-5.6 17.3-12.1 0-6.2-.3-22.8-.3-44.8-68.9 15-83.5-33.2-83.5-33.2-11.2-28.5-27.5-36-27.5-36-22.5-15.3 1.7-15 1.7-15 24.9 1.7 38 25.6 38 25.6 22.1 37.8 58 26.9 72.2 20.5 2.3-16 8.6-26.9 15.6-33.1-55.1-6.2-112.9-27.5-112.9-122.7 0-27.1 9.7-49.3 25.6-66.7-2.6-6.3-11.1-31.6 2.4-65.8 0 0 20.8-6.7 68.2 25.5 19.8-5.5 40.9-8.3 62-8.3 21.1 0 42.2 2.8 62 8.3 47.4-32.2 68.2-25.5 68.2-25.5 13.5 34.2 5 59.5 2.4 65.8 15.9 17.4 25.6 39.6 25.6 66.7 0 95.3-57.9 116.5-113 122.7 8.9 7.7 16.8 22.8 16.8 45.9 0 33.1-.3 59.8-.3 67.9 0 6.5 4.5 14.4 17.3 12.1C426.2 457.8 496 362.9 496 252 496 113.3 383.5 8 244.8 8zM97.2 352.9c-1.3 1-1 3.3.7 5.2 1.6 1.6 3.9 2.3 5.2 1 1.3-1 1-3.3-.7-5.2-1.6-1.6-3.9-2.3-5.2-1zm-10.8-8.1c-.7 1.3.3 2.9 2.3 3.9 1.6 1 3.6.7 4.3-.7.7-1.3-.3-2.9-2.3-3.9-2-.6-3.6-.3-4.3.7zm32.4 35.6c-1.6 1.3-1 4.3 1.3 6.2 2.3 2.3 5.2 2.6 6.5 1 1.3-1.3.7-4.3-1.3-6.2-2.2-2.3-5.2-2.6-6.5-1zm-11.4-14.7c-1.6 1-1.6 3.6 0 5.9 1.6 2.3 4.3 3.3 5.6 2.3 1.6-1.3 1.6-3.9 0-6.2-1.4-2.3-4-3.3-5.6-2z"/>
                    </svg>
                </button>
            </div>
        </div>
        <span class="agreement"><a href="#">Made with ❤️ for the TIMAWA squad</a></span>
        
        <div class="signup-link">
            Don't have an account? <a onclick="showSignUp()">Sign up here</a>
        </div>
    </div>

    <!-- Sign Up Modal -->
    <div id="signupModal" class="modal">
        <div class="modal-content">
            <h2>🇹🇮🇲🇦🇼🇦 Join the Squad</h2>
            <form id="signupForm">
                <input class="input" type="text" id="signupName" placeholder="Full Name" required />
                <input class="input" type="email" id="signupEmail" placeholder="E-mail" required />
                <input class="input" type="password" id="signupPassword" placeholder="Password (min 6 characters)" required />
                <button type="submit" class="login-button">Create Account</button>
            </form>
            <button onclick="closeSignUp()" class="cancel-btn">Cancel</button>
        </div>
    </div>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyC05mMZ304IN_S0-NRv2Uf7E5_tZLiM4Js",
            authDomain: "timawa2.firebaseapp.com",
            projectId: "timawa2",
            storageBucket: "timawa2.firebasestorage.app",
            messagingSenderId: "1051426551565",
            appId: "1:1051426551565:web:01d33631309bb9336fe244"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== CHECK LOGIN STATUS =====
        auth.onAuthStateChanged(user => {
            if (user) {
                window.location.href = 'dashboard.html';
            }
        });

        // ===== LOGIN FORM =====
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('loginBtn');
            
            if (!email || !password) {
                showError('Please fill in all fields');
                return;
            }
            
            showLoading(btn);
            hideMessages();
            
            try {
                await auth.signInWithEmailAndPassword(email, password);
                // Redirect happens automatically via onAuthStateChanged
            } catch (error) {
                console.error('Login error:', error);
                
                let errorMessage = error.message;
                if (error.code === 'auth/user-not-found') {
                    errorMessage = 'No account found with this email. Please sign up first.';
                } else if (error.code === 'auth/wrong-password') {
                    errorMessage = 'Incorrect password. Please try again.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Invalid email address. Please check and try again.';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMessage = 'Too many failed attempts. Please try again later.';
                }
                
                showError(errorMessage);
                hideLoading(btn);
            }
        });

        // ===== SIGN UP FORM =====
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            
            hideMessages();
            
            if (!name || !email || !password) {
                showError('Please fill in all fields');
                return;
            }
            
            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }
            
            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                
                // Update profile with display name
                await userCredential.user.updateProfile({
                    displayName: name
                });
                
                // Save user to Firestore
                await db.collection('users').doc(userCredential.user.uid).set({
                    displayName: name,
                    email: email,
                    status: 'available',
                    location: 'Alabat, Quezon',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                showSuccess('Account created successfully! Redirecting...');
                
                setTimeout(() => {
                    closeSignUp();
                    window.location.href = 'dashboard.html';
                }, 1500);
                
            } catch (error) {
                console.error('Signup error:', error);
                
                let errorMessage = error.message;
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = 'This email is already registered. Please sign in instead.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Invalid email address. Please check and try again.';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = 'Password is too weak. Please use at least 6 characters.';
                }
                
                showError(errorMessage);
            }
        });

        // ===== GOOGLE SIGN IN =====
        async function signInWithGoogle() {
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await auth.signInWithPopup(provider);
                
                // Check if user exists in Firestore
                const userDoc = await db.collection('users').doc(result.user.uid).get();
                if (!userDoc.exists) {
                    // Create user profile for first time Google sign-in
                    await db.collection('users').doc(result.user.uid).set({
                        displayName: result.user.displayName || 'User',
                        email: result.user.email,
                        status: 'available',
                        location: 'Alabat, Quezon',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                
                window.location.href = 'dashboard.html';
            } catch (error) {
                console.error('Google sign-in error:', error);
                showError('Google sign-in failed: ' + error.message);
            }
        }

        // ===== GITHUB SIGN IN =====
        async function signInWithGithub() {
            try {
                const provider = new firebase.auth.GithubAuthProvider();
                const result = await auth.signInWithPopup(provider);
                
                const userDoc = await db.collection('users').doc(result.user.uid).get();
                if (!userDoc.exists) {
                    await db.collection('users').doc(result.user.uid).set({
                        displayName: result.user.displayName || 'User',
                        email: result.user.email || 'github-user',
                        status: 'available',
                        location: 'Alabat, Quezon',
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                }
                
                window.location.href = 'dashboard.html';
            } catch (error) {
                console.error('GitHub sign-in error:', error);
                showError('GitHub sign-in failed: ' + error.message);
            }
        }

        // ===== PASSWORD RESET =====
        async function resetPassword() {
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showError('Please enter your email address first');
                return;
            }
            try {
                await auth.sendPasswordResetEmail(email);
                showSuccess('Password reset email sent! Check your inbox.');
                setTimeout(() => {
                    document.getElementById('successMessage').style.display = 'none';
                }, 5000);
            } catch (error) {
                console.error('Reset error:', error);
                showError(error.message);
            }
        }

        // ===== UI FUNCTIONS =====
        function showSignUp() {
            document.getElementById('signupModal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeSignUp() {
            document.getElementById('signupModal').style.display = 'none';
            document.body.style.overflow = 'auto';
            document.getElementById('signupForm').reset();
        }

        function showError(message) {
            const el = document.getElementById('errorMessage');
            el.textContent = message;
            el.style.display = 'block';
            document.getElementById('successMessage').style.display = 'none';
        }

        function showSuccess(message) {
            const el = document.getElementById('successMessage');
            el.textContent = message;
            el.style.display = 'block';
            document.getElementById('errorMessage').style.display = 'none';
        }

        function hideMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
        }

        function showLoading(btn) {
            btn.innerHTML = '<span class="loading-spinner"></span> Loading...';
            btn.disabled = true;
        }

        function hideLoading(btn) {
            btn.innerHTML = 'Sign In';
            btn.disabled = false;
        }

        // ===== CLOSE MODAL ON OUTSIDE CLICK =====
        window.onclick = function(event) {
            const modal = document.getElementById('signupModal');
            if (event.target === modal) {
                closeSignUp();
            }
        }
    </script>
</body>
</html>
