<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TIMAWA - Highlights</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Cloudinary Upload Widget -->
    <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
    
    <style>
        /* ========== RESET & BASE ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            min-height: 100vh;
            background: #f8faff;
            color: #1a1a2e;
            line-height: 1.6;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 14px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(16, 137, 211, 0.08);
            transition: all 0.3s ease;
            box-shadow: 0 2px 20px rgba(0,0,0,0.04);
        }

        .navbar .logo {
            font-size: 26px;
            font-weight: 900;
            color: rgb(16, 137, 211);
            letter-spacing: 2px;
            text-decoration: none;
        }

        .navbar .logo span {
            background: linear-gradient(45deg, rgb(16, 137, 211) 0%, rgb(18, 177, 209) 100%);
            padding: 2px 10px;
            border-radius: 8px;
            font-size: 10px;
            color: white;
            margin-left: 8px;
        }

        .navbar .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
            list-style: none;
        }

        .navbar .nav-links a {
            text-decoration: none;
            color: #555;
            font-weight: 500;
            font-size: 14px;
            transition: all 0.3s ease;
            padding: 6px 12px;
            border-radius: 8px;
        }

        .navbar .nav-links a:hover {
            color: rgb(16, 137, 211);
            background: rgba(16, 137, 211, 0.06);
        }

        .navbar .nav-links a.active {
            color: rgb(16, 137, 211);
            background: rgba(16, 137, 211, 0.08);
        }

        .navbar .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            padding: 4px 14px 4px 4px;
            border-radius: 50px;
            box-shadow: #cff0ff 0px 4px 10px -4px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
        }

        .navbar .user-profile:hover {
            border-color: rgb(16, 137, 211);
        }

        .navbar .user-avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(45deg, rgb(16, 137, 211) 0%, rgb(18, 177, 209) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 14px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .navbar .user-avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .navbar .user-name {
            color: #333;
            font-weight: 600;
            font-size: 13px;
        }

        .navbar .logout-btn {
            background: white;
            border: 2px solid #fee2e2;
            color: #ef4444;
            padding: 6px 14px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
            font-weight: 600;
            box-shadow: #cff0ff 0px 4px 8px -4px;
        }

        .navbar .logout-btn:hover {
            background: #fee2e2;
            transform: scale(1.03);
        }

        .navbar .mobile-toggle {
            display: none;
            font-size: 24px;
            color: rgb(16, 137, 211);
            cursor: pointer;
            background: none;
            border: none;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            max-width: 1200px;
            margin: 80px auto 40px;
            padding: 0 40px;
        }

        /* ===== HERO BANNER ===== */
        .hero-banner {
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            border-radius: 24px;
            padding: 40px 50px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            box-shadow: 0 4px 30px rgba(16, 137, 211, 0.1);
        }

        .hero-banner .content h1 {
            font-size: 28px;
            font-weight: 800;
            color: #1a1a2e;
        }

        .hero-banner .content h1 .highlight {
            background: linear-gradient(45deg, rgb(16, 137, 211) 0%, rgb(18, 177, 209) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-banner .content p {
            color: #555;
            font-size: 15px;
        }

        .hero-banner .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(45deg, rgb(16, 137, 211) 0%, rgb(18, 177, 209) 100%);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(16, 137, 211, 0.25);
        }

        .btn-primary:hover {
            transform: scale(1.03);
            box-shadow: 0 6px 25px rgba(16, 137, 211, 0.35);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            color: rgb(16, 137, 211);
            padding: 12px 24px;
            border-radius: 50px;
            border: 2px solid #e0e7ff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            border-color: rgb(16, 137, 211);
            background: #f8faff;
            transform: scale(1.03);
        }

        /* ===== HIGHLIGHTS GRID ===== */
        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .highlight-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #eef2f7;
            box-shadow: 0 2px 15px rgba(0,0,0,0.04);
            transition: all 0.3s ease;
        }

        .highlight-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 40px rgba(16, 137, 211, 0.08);
            border-color: rgba(16, 137, 211, 0.2);
        }

        .highlight-card .image-container {
            width: 100%;
            height: 250px;
            overflow: hidden;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            position: relative;
        }

        .highlight-card .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .highlight-card:hover .image-container img {
            transform: scale(1.05);
        }

        .highlight-card .image-container .expiry-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
        }

        .highlight-card .image-container .expiry-badge i {
            margin-right: 4px;
        }

        .highlight-card .image-container .delete-btn {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(239, 68, 68, 0.9);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            opacity: 0;
        }

        .highlight-card:hover .image-container .delete-btn {
            opacity: 1;
        }

        .highlight-card:hover .image-container .delete-btn:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        .highlight-card .card-body {
            padding: 18px 20px;
        }

        .highlight-card .card-body .caption {
            font-size: 15px;
            color: #333;
            line-height: 1.6;
            margin-bottom: 8px;
        }

        .highlight-card .card-body .meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #888;
        }

        .highlight-card .card-body .meta .author {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .highlight-card .card-body .meta .author .avatar-small {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: linear-gradient(45deg, rgb(16, 137, 211) 0%, rgb(18, 177, 209) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 10px;
            font-weight: 700;
        }

        .highlight-card .card-body .meta .expiry-time {
            color: #f59e0b;
        }

        .highlight-card .card-body .meta .expiry-time.urgent {
            color: #ef4444;
            font-weight: 600;
        }

        /* ===== UPLOAD MODAL ===== */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 35px;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }

        .modal-content h2 {
            color: rgb(16, 137, 211);
            font-size: 24px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .modal-content .input-group {
            margin-bottom: 16px;
        }

        .modal-content .input-group label {
            color: #555;
            font-size: 13px;
            font-weight: 600;
            display: block;
            margin-bottom: 5px;
        }

        .modal-content .input-group textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px solid #e0e7ff;
            background: #f8faff;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: inherit;
            color: #333;
            min-height: 80px;
            resize: vertical;
        }

        .modal-content .input-group textarea:focus {
            outline: none;
            border-color: rgb(16, 137, 211);
            box-shadow: 0 0 0 3px rgba(16, 137, 211, 0.1);
        }

        .modal-content .upload-area {
            border: 2px dashed #e0e7ff;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8faff;
        }

        .modal-content .upload-area:hover {
            border-color: rgb(16, 137, 211);
            background: #f0f7ff;
        }

        .modal-content .upload-area i {
            font-size: 40px;
            color: rgb(16, 137, 211);
            display: block;
            margin-bottom: 10px;
        }

        .modal-content .upload-area p {
            color: #888;
            font-size: 14px;
        }

        .modal-content .upload-area .file-list {
            margin-top: 10px;
            text-align: left;
        }

        .modal-content .upload-area .file-list .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: white;
            border-radius: 8px;
            margin-bottom: 5px;
            border: 1px solid #e0e7ff;
            font-size: 13px;
        }

        .modal-content .upload-area .file-list .file-item .remove-file {
            color: #ef4444;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 14px;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .modal-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .modal-actions .btn-primary {
            background: linear-gradient(45deg, rgb(16, 137, 211) 0%, rgb(18, 177, 209) 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 137, 211, 0.25);
        }

        .modal-actions .btn-primary:hover {
            transform: scale(1.02);
        }

        .modal-actions .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .modal-actions .btn-secondary {
            background: #f3f4f6;
            color: #666;
        }

        .modal-actions .btn-secondary:hover {
            background: #e5e7eb;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ===== EMPTY STATE ===== */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #888;
            grid-column: 1 / -1;
        }

        .empty-state i {
            font-size: 48px;
            color: #cff0ff;
            display: block;
            margin-bottom: 15px;
        }

        .empty-state h3 {
            color: #333;
            font-size: 20px;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: #999;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .navbar { padding: 12px 20px; }
            .navbar .nav-links {
                display: none;
                flex-direction: column;
                position: absolute;
                top: 100%;
                left: 0;
                right: 0;
                background: white;
                padding: 20px;
                border-bottom: 2px solid #f0f4ff;
                gap: 12px;
                box-shadow: 0 20px 30px rgba(0,0,0,0.05);
            }
            .navbar .nav-links.active { display: flex; }
            .navbar .mobile-toggle { display: block; }
            .main-content { padding: 0 20px; margin-top: 70px; }
            .hero-banner {
                padding: 25px 20px;
                flex-direction: column;
                text-align: center;
            }
            .hero-banner .content h1 { font-size: 22px; }
            .hero-banner .actions { justify-content: center; width: 100%; }
            .highlights-grid { grid-template-columns: 1fr; }
            .modal-content { padding: 25px; }
            .modal-actions { flex-direction: column; }
            .highlight-card .image-container { height: 200px; }
        }

        @media (max-width: 480px) {
            .hero-banner .content h1 { font-size: 20px; }
            .hero-banner .actions { flex-direction: column; }
            .hero-banner .actions button { width: 100%; justify-content: center; }
            .highlight-card .image-container { height: 180px; }
            .highlight-card .image-container .delete-btn { opacity: 1; }
            .modal-content { padding: 20px; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f0f4ff; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(45deg, rgb(16, 137, 211) 0%, rgb(18, 177, 209) 100%); border-radius: 10px; }
    </style>
</head>
<body>
    <!-- ===== NAVIGATION ===== -->
    <nav class="navbar" id="navbar">
        <a href="index.html" class="logo">TIMAWA <span>HUB</span></a>
        <button class="mobile-toggle" onclick="toggleMobileMenu()"><i class="fas fa-bars"></i></button>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html"><i class="fas fa-home"></i></a></li>
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="calendar.html"><i class="fas fa-calendar-alt"></i> Calendar</a></li>
            <li><a href="highlights.html" class="active"><i class="fas fa-images"></i> Highlights</a></li>
            <li>
                <a href="profile.html" class="user-profile" id="userProfileLink">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <span class="user-name" id="userName">Loading...</span>
                </a>
            </li>
            <li><button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button></li>
        </ul>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-content">

        <!-- ===== HERO BANNER ===== -->
        <div class="hero-banner">
            <div class="content">
                <h1>📸 Squad <span class="highlight">Highlights</span></h1>
                <p>Share your favorite moments with the squad! Photos expire after 7 days.</p>
            </div>
            <div class="actions">
                <button class="btn-primary" onclick="showUploadModal()"><i class="fas fa-cloud-upload-alt"></i> Upload Highlights</button>
                <button class="btn-secondary" onclick="loadHighlights()"><i class="fas fa-sync"></i> Refresh</button>
            </div>
        </div>

        <!-- ===== HIGHLIGHTS GRID ===== -->
        <div class="highlights-grid" id="highlightsGrid">
            <!-- Highlights will be loaded here -->
        </div>
    </div>

    <!-- ===== UPLOAD MODAL ===== -->
    <div id="uploadModal" class="modal">
        <div class="modal-content">
            <h2><i class="fas fa-cloud-upload-alt"></i> Upload Highlights</h2>
            <form id="uploadForm">
                <div class="input-group">
                    <label>Caption</label>
                    <textarea id="captionInput" placeholder="Write something about these photos..."></textarea>
                </div>
                <div class="input-group">
                    <label>Photos</label>
                    <div class="upload-area" id="uploadArea">
                        <i class="fas fa-images"></i>
                        <p>Click to upload photos (max 10 images)</p>
                        <div class="file-list" id="fileList"></div>
                    </div>
                    <input type="file" id="fileInput" accept="image/*" multiple style="display: none;" />
                </div>
                <div class="modal-actions">
                    <button type="submit" class="btn-primary" id="uploadBtn"><i class="fas fa-upload"></i> Upload</button>
                    <button type="button" class="btn-secondary" onclick="closeUploadModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            apiKey: "AIzaSyC05mMZ304IN_S0-NRv2Uf7E5_tZLiM4Js",
            authDomain: "timawa2.firebaseapp.com",
            projectId: "timawa2",
            storageBucket: "timawa2.firebasestorage.app",
            messagingSenderId: "1051426551565",
            appId: "1:1051426551565:web:01d33631309bb9336fe244"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let selectedFiles = [];
        let unsubscribeHighlights = null;

        // ===== CLOUDINARY CONFIG =====
        const CLOUDINARY_CONFIG = {
            cloudName: "ooq99nlw",
            uploadPreset: "t-imawa"
        };

        // ===== AUTH STATE =====
        auth.onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }

            currentUser = user;

            try {
                const doc = await db.collection('users').doc(user.uid).get();
                const data = doc.data();
                const name = data?.displayName || user.displayName || user.email || 'User';
                document.getElementById('userName').textContent = name;

                const avatarEl = document.getElementById('userAvatar');
                if (data?.photoURL) {
                    avatarEl.innerHTML = `<img src="${data.photoURL}" alt="${name}" />`;
                } else {
                    avatarEl.textContent = name.charAt(0).toUpperCase();
                }
            } catch (error) {
                console.error('Error loading user data:', error);
            }

            loadHighlights();
        });

        // ===== LOAD HIGHLIGHTS =====
        function loadHighlights() {
            if (unsubscribeHighlights) {
                unsubscribeHighlights();
            }

            unsubscribeHighlights = db.collection('highlights')
                .orderBy('createdAt', 'desc')
                .onSnapshot((snapshot) => {
                    const grid = document.getElementById('highlightsGrid');
                    
                    if (snapshot.empty) {
                        grid.innerHTML = `
                            <div class="empty-state">
                                <i class="fas fa-images"></i>
                                <h3>No highlights yet</h3>
                                <p>Be the first to share a moment with the squad!</p>
                            </div>
                        `;
                        return;
                    }

                    let html = '';
                    const now = new Date();

                    snapshot.forEach(doc => {
                        const data = doc.data();
                        const id = doc.id;
                        const createdAt = data.createdAt ? new Date(data.createdAt.toDate()) : new Date();
                        const expiresAt = data.expiresAt ? new Date(data.expiresAt.toDate()) : new Date();
                        const timeLeft = expiresAt - now;
                        const daysLeft = Math.ceil(timeLeft / (1000 * 60 * 60 * 24));
                        
                        // Check if expired
                        if (timeLeft <= 0) {
                            // Delete expired highlight
                            deleteHighlight(id, data.imageURLs || []);
                            return;
                        }

                        const imageUrls = data.imageURLs || [];
                        const authorName = data.authorName || 'Someone';
                        const initials = authorName.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
                        const caption = data.caption || '';
                        const isUrgent = daysLeft <= 1;

                        // Use first image as main
                        const mainImage = imageUrls.length > 0 ? imageUrls[0] : '';

                        html += `
                            <div class="highlight-card" data-id="${id}">
                                <div class="image-container">
                                    ${mainImage ? 
                                        `<img src="${mainImage}" alt="Highlight" />` :
                                        `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:48px;color:rgb(16,137,211);"><i class="fas fa-image"></i></div>`
                                    }
                                    ${imageUrls.length > 1 ? 
                                        `<div style="position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,0.6);color:white;padding:4px 10px;border-radius:50px;font-size:11px;">+${imageUrls.length - 1} more</div>` : 
                                        ''
                                    }
                                    <span class="expiry-badge"><i class="fas fa-clock"></i> ${daysLeft} day${daysLeft !== 1 ? 's' : ''} left</span>
                                    <button class="delete-btn" onclick="deleteHighlight('${id}', ${JSON.stringify(imageUrls)})"><i class="fas fa-trash"></i> Delete</button>
                                </div>
                                <div class="card-body">
                                    ${caption ? `<div class="caption">${escapeHtml(caption)}</div>` : ''}
                                    <div class="meta">
                                        <span class="author">
                                            <span class="avatar-small">${initials}</span>
                                            ${authorName}
                                        </span>
                                        <span class="expiry-time ${isUrgent ? 'urgent' : ''}">
                                            <i class="fas fa-clock"></i> ${daysLeft} day${daysLeft !== 1 ? 's' : ''} left
                                        </span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });

                    grid.innerHTML = html || `
                        <div class="empty-state">
                            <i class="fas fa-images"></i>
                            <h3>No highlights yet</h3>
                            <p>Be the first to share a moment with the squad!</p>
                        </div>
                    `;
                }, (error) => {
                    console.error('Error loading highlights:', error);
                });
        }

        // ===== DELETE HIGHLIGHT =====
        async function deleteHighlight(id, imageUrls) {
            if (!confirm('Are you sure you want to delete this highlight?')) return;

            try {
                // Delete images from Cloudinary
                for (const url of imageUrls) {
                    try {
                        const publicId = url.split('/').pop().split('.')[0];
                        await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CONFIG.cloudName}/image/destroy`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                public_id: `t-imawa/highlights/${publicId}`
                            })
                        });
                    } catch (e) {
                        console.warn('Error deleting image from Cloudinary:', e);
                    }
                }

                // Delete from Firestore
                await db.collection('highlights').doc(id).delete();
                console.log('✅ Highlight deleted successfully');
            } catch (error) {
                console.error('Error deleting highlight:', error);
                alert('Error deleting highlight: ' + error.message);
            }
        }

        // ===== UPLOAD TO CLOUDINARY =====
        async function uploadToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_CONFIG.uploadPreset);
            formData.append('folder', 't-imawa/highlights');

            return new Promise((resolve, reject) => {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', `https://api.cloudinary.com/v1_1/${CLOUDINARY_CONFIG.cloudName}/image/upload`);
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        const response = JSON.parse(xhr.responseText);
                        resolve(response.secure_url);
                    } else {
                        reject(new Error('Upload failed: ' + xhr.statusText));
                    }
                };
                xhr.onerror = function() {
                    reject(new Error('Network error'));
                };
                xhr.send(formData);
            });
        }

        // ===== SHOW UPLOAD MODAL =====
        function showUploadModal() {
            document.getElementById('uploadModal').classList.add('active');
            document.body.style.overflow = 'hidden';
            selectedFiles = [];
            document.getElementById('fileList').innerHTML = '';
            document.getElementById('fileInput').value = '';
            document.getElementById('captionInput').value = '';
        }

        // ===== CLOSE UPLOAD MODAL =====
        function closeUploadModal() {
            document.getElementById('uploadModal').classList.remove('active');
            document.body.style.overflow = 'auto';
            selectedFiles = [];
            document.getElementById('fileList').innerHTML = '';
            document.getElementById('fileInput').value = '';
        }

        // ===== FILE INPUT HANDLER =====
        document.getElementById('uploadArea').addEventListener('click', function() {
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', function(e) {
            const files = Array.from(e.target.files);
            const remaining = 10 - selectedFiles.length;
            
            if (files.length > remaining) {
                alert(`You can only select ${remaining} more file${remaining > 1 ? 's' : ''}`);
                return;
            }

            selectedFiles = [...selectedFiles, ...files.slice(0, remaining)];
            updateFileList();
        });

        function updateFileList() {
            const container = document.getElementById('fileList');
            if (selectedFiles.length === 0) {
                container.innerHTML = '';
                return;
            }

            let html = '';
            selectedFiles.forEach((file, index) => {
                html += `
                    <div class="file-item">
                        <span><i class="fas fa-image"></i> ${file.name} (${Math.round(file.size / 1024)}KB)</span>
                        <button class="remove-file" onclick="removeFile(${index})"><i class="fas fa-times"></i></button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateFileList();
        }

        // ===== UPLOAD FORM SUBMIT =====
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (selectedFiles.length === 0) {
                alert('Please select at least one photo to upload');
                return;
            }

            const caption = document.getElementById('captionInput').value.trim();
            const submitBtn = document.getElementById('uploadBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span> Uploading...';

            try {
                const user = auth.currentUser;
                const userDoc = await db.collection('users').doc(user.uid).get();
                const userData = userDoc.data();
                const authorName = userData?.displayName || user.displayName || user.email || 'Someone';

                // Upload all images
                const imageUrls = [];
                for (const file of selectedFiles) {
                    try {
                        const url = await uploadToCloudinary(file);
                        imageUrls.push(url);
                    } catch (err) {
                        console.error('Error uploading file:', err);
                        alert(`Failed to upload ${file.name}: ${err.message}`);
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-upload"></i> Upload';
                        return;
                    }
                }

                // Calculate expiry (7 days from now)
                const expiresAt = new Date();
                expiresAt.setDate(expiresAt.getDate() + 7);

                // Save to Firestore
                await db.collection('highlights').add({
                    imageURLs: imageUrls,
                    caption: caption,
                    authorName: authorName,
                    authorUid: user.uid,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    expiresAt: expiresAt
                });

                closeUploadModal();
                alert('✅ Highlights uploaded successfully! They will expire in 7 days.');
                loadHighlights();

            } catch (error) {
                console.error('Error uploading highlights:', error);
                alert('❌ Error uploading highlights: ' + error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-upload"></i> Upload';
            }
        });

        // ===== HELPER FUNCTIONS =====
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ===== MOBILE MENU =====
        function toggleMobileMenu() {
            const nav = document.getElementById('navLinks');
            nav.classList.toggle('active');
        }

        document.querySelectorAll('.nav-links a, .nav-links button').forEach(link => {
            link.addEventListener('click', () => {
                document.getElementById('navLinks').classList.remove('active');
            });
        });

        // ===== LOGOUT =====
        async function logout() {
            try {
                await auth.signOut();
                window.location.href = 'index.html';
            } catch (error) {
                alert('Error signing out: ' + error.message);
            }
        }

        // ===== CLOSE MODAL ON OUTSIDE CLICK =====
        window.onclick = function(event) {
            const uploadModal = document.getElementById('uploadModal');
            if (event.target === uploadModal) {
                closeUploadModal();
            }
        }

        // ===== NAVBAR SCROLL EFFECT =====
        window.addEventListener('scroll', function() {
            const navbar = document.getElementById('navbar');
            if (window.scrollY > 20) {
                navbar.style.boxShadow = '0 2px 30px rgba(0,0,0,0.08)';
            } else {
                navbar.style.boxShadow = '0 2px 20px rgba(0,0,0,0.04)';
            }
        });
    </script>
</body>
</html>
